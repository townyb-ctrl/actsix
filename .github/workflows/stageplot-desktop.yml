name: Stageplot desktop

# Builds the Mac (.dmg) and Windows (.exe) installers on real Mac and Windows machines.
# Every push that touches stageplot/ leaves the installers on the run's page (Artifacts);
# pushing a tag like stageplot-v1.0.0 also publishes them as a GitHub Release.
on:
  push:
    branches: ['**']
    paths: ['stageplot/**', '.github/workflows/stageplot-desktop.yml']
    tags: ['stageplot-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: stageplot/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stageplot/desktop/package-lock.json
      - run: npm ci
      - name: Build installer
        run: npm run dist:${{ matrix.target }}
        env:
          # no signing certificates yet: the Mac app is ad-hoc signed, the Windows one unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Stageplot-${{ matrix.target }}
          path: |
            stageplot/desktop/dist/*.dmg
            stageplot/desktop/dist/*-mac.zip
            stageplot/desktop/dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/stageplot-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Mac: open the .dmg and drag Stageplot to Applications.
          Windows: run Stageplot-Setup (x64 for most PCs, arm64 for Snapdragon / Copilot+ PCs).
          First-open steps for unsigned builds are in stageplot/desktop/README.md.
          NOTES
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Stageplot ${GITHUB_REF_NAME#stageplot-v}" --notes-file notes.md
