<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stageplot Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-column workbench (team/gear rail · scaled plot · inspector), stacks on phones. */
:root {
  --bg: #e9edef;
  --panel: #fbfcfc;
  --panel-2: #f2f5f6;
  --ink: #1a1f23;
  --muted: #5a666e;
  --line: #cdd5da;
  --accent: #e3a400;          /* spike-tape yellow */
  --accent-ink: #1a1f23;
  --deck: #2a3034;            /* painted stage deck */
  --deck-grid: rgba(255,255,255,.07);
  --deck-grid-major: rgba(255,255,255,.16);
  --house: #d9dfe2;
  --house-ink: #44515a;
  --ok: #2f8f55;
  --warn: #c77800;
  --bad: #c8372d;
  --k-xlr: #3d8bdb;
  --k-cat: #9b5de5;
  --k-pow: #f2711c;
  --k-inst: #2fa65a;
  --k-spk: #12a3a0;
  --k-vid: #e0457b;
  --f-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --f-body: "Archivo", "Segoe UI", system-ui, sans-serif;
  --f-cond: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111417; --panel: #181d21; --panel-2: #1f252a; --ink: #e5e9ec; --muted: #94a1a9; --line: #2c343a;
    --accent: #f2b51d; --accent-ink: #15181b; --deck: #2b3237; --house: #161a1d; --house-ink: #8d9aa2;
    --deck-grid: rgba(255,255,255,.06); --deck-grid-major: rgba(255,255,255,.14);
    --ok: #4cc17a; --warn: #f0a23a; --bad: #ff6b5e;
    --k-xlr: #6fb5ff; --k-cat: #c38bff; --k-pow: #ff8a3d; --k-inst: #6fdc8c; --k-spk: #43d1c7; --k-vid: #ff6f9c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111417; --panel: #181d21; --panel-2: #1f252a; --ink: #e5e9ec; --muted: #94a1a9; --line: #2c343a;
  --accent: #f2b51d; --accent-ink: #15181b; --deck: #2b3237; --house: #161a1d; --house-ink: #8d9aa2;
  --deck-grid: rgba(255,255,255,.06); --deck-grid-major: rgba(255,255,255,.14);
  --ok: #4cc17a; --warn: #f0a23a; --bad: #ff6b5e;
  --k-xlr: #6fb5ff; --k-cat: #c38bff; --k-pow: #ff8a3d; --k-inst: #6fdc8c; --k-spk: #43d1c7; --k-vid: #ff6f9c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font: 800 22px/1 var(--f-display); font-stretch: 118%; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.brand i { display: inline-block; width: 22px; height: 8px; background: var(--accent); transform: rotate(-4deg); }
.week { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex: 1 1 380px; min-width: 0; }
.week select { max-width: 260px; }
.week input[type="text"] { flex: 1 1 140px; min-width: 0; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 6px 12px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

input, select, textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; min-width: 0; }
textarea { width: 100%; resize: vertical; font: 13px/1.4 var(--f-mono); }
button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
button.danger { color: var(--bad); }
button.ghost { background: transparent; }
button:disabled { opacity: .5; cursor: default; }

/* ---------- workbench ---------- */
.work { display: grid; grid-template-columns: 300px minmax(0,1fr) 290px; flex: 1 1 0; min-height: 520px; }
.rail { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; min-width: 0; }
.inspector { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 14px 16px 24px; min-width: 0; }
.tabs { display: flex; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 1; }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 11px 4px; font: 600 13px/1 var(--f-cond); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { padding: 14px 16px 24px; display: grid; gap: 14px; }

h2, h3 { margin: 0; text-wrap: balance; }
.h { font: 700 18px/1.2 var(--f-display); letter-spacing: -.005em; }
.label { font: 600 11px/1.2 var(--f-cond); font-stretch: 90%; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field input, .field select { width: 100%; }

.person { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.person input[type="text"] { width: 100%; }
.person select { width: 100%; }
.person .sub { display: flex; justify-content: space-between; align-items: center; grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.people { display: grid; gap: 8px; }

.gearcat { display: grid; gap: 6px; }
.gearlist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.gearlist button { text-align: left; white-space: normal; display: flex; gap: 8px; align-items: center; padding: 6px 8px; font-size: 13px; line-height: 1.15; }
.swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; }

.pco { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.pco select { width: 100%; }
.roster { display: grid; gap: 2px; max-height: 280px; overflow: auto; font-size: 13px; }
.roster label { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; padding: 4px 2px; }
.roster small { display: block; color: var(--muted); }
.pco .err { color: var(--bad); font-size: 13px; margin: 0; }

/* ---------- plot ---------- */
.stagecol { display: grid; grid-template-rows: auto minmax(0,1fr) auto; min-width: 0; min-height: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.scroller { overflow: auto; min-height: 0; padding: 12px; background: var(--house); }
#plot { display: block; margin: 0 auto; user-select: none; -webkit-user-select: none; }
.statusline { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 12px; border-top: 1px solid var(--line); background: var(--panel); font: 13px/1.3 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.statusline b { color: var(--ink); font-weight: 500; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font: 600 11px/1.7 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }

svg text { font-family: var(--f-cond); font-stretch: 85%; }
.house-fill { fill: var(--house); }
.deck { fill: var(--deck); }
.g-minor { stroke: var(--deck-grid); stroke-width: .04; }
.g-major { stroke: var(--deck-grid-major); stroke-width: .06; }
.edge { stroke: var(--accent); stroke-width: .18; stroke-dasharray: .6 .3; }
.ruler line { stroke: var(--house-ink); stroke-width: .05; }
.ruler text { fill: var(--house-ink); font-size: .55px; font-family: var(--f-mono); }
.zone { fill: var(--house-ink); font-size: .7px; letter-spacing: .12px; font-weight: 600; }
.zone.on-deck { fill: rgba(255,255,255,.35); }
.item { cursor: grab; touch-action: none; }
.item .body { stroke: rgba(0,0,0,.35); stroke-width: .05; }
.c-audio { fill: #3b6f99; } .c-inst { fill: #6b4f8a; } .c-power { fill: #a6501c; } .c-infra { fill: #4f5e68; }
.c-video { fill: #8a3e5a; } .c-staging { fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.45) !important; stroke-dasharray: .3 .2; stroke-width: .08 !important; }
.c-person { fill: var(--accent); }
.item .detail { stroke: rgba(255,255,255,.4); stroke-width: .05; fill: none; }
.ilabel { fill: #fff; font-size: .5px; font-weight: 600; paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: .12px; pointer-events: none; }
.ilabel.out { fill: var(--house-ink); stroke: none; }
.initials { fill: var(--accent-ink); font-size: .62px; font-weight: 700; pointer-events: none; }
.selbox { fill: none; stroke: var(--accent); stroke-width: .12; stroke-dasharray: .35 .2; pointer-events: none; }
.cab { fill: none; stroke-width: .16; stroke-linejoin: round; stroke-linecap: round; opacity: .9; pointer-events: none; }
.cab.sel { stroke-width: .3; opacity: 1; }
.cabhit { fill: none; stroke: transparent; stroke-width: .8; cursor: pointer; }
.k-xlr { stroke: var(--k-xlr); } .k-cat6 { stroke: var(--k-cat); } .k-power { stroke: var(--k-pow); }
.k-inst { stroke: var(--k-inst); } .k-speakon { stroke: var(--k-spk); } .k-video { stroke: var(--k-vid); }
.bg-xlr { background: var(--k-xlr); } .bg-cat6 { background: var(--k-cat); } .bg-power { background: var(--k-pow); }
.bg-inst { background: var(--k-inst); } .bg-speakon { background: var(--k-spk); } .bg-video { background: var(--k-vid); }
.cablen { font: .5px var(--f-mono); fill: #fff; paint-order: stroke; stroke: rgba(0,0,0,.75); stroke-width: .14px; pointer-events: none; }
.wp { fill: var(--accent); stroke: #000; stroke-width: .05; cursor: move; touch-action: none; }
.pending { fill: none; stroke: var(--accent); stroke-width: .14; stroke-dasharray: .4 .25; pointer-events: none; }
.plotting .item { cursor: crosshair; }

/* ---------- inspector ---------- */
.insp { display: grid; gap: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.legend { display: grid; gap: 4px; font-size: 13px; }
.legend span.line { display: inline-block; width: 22px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 8px; }
.warnlist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.warnlist li { padding: 6px 8px; border-radius: 5px; background: var(--panel-2); border-left: 3px solid var(--warn); }
.warnlist li.bad { border-left-color: var(--bad); }
.kbd { font: 12px var(--f-mono); padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; }

/* ---------- paperwork ---------- */
.paper { flex: 1 1 0; min-height: 0; overflow: auto; padding-block: 20px 48px; padding-inline: 16px; }
.paper-inner { max-width: 1100px; margin: 0 auto; display: grid; gap: 28px; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.sheet header { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; justify-content: space-between; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 600 11px/1.2 var(--f-cond); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.mono { font-family: var(--f-mono); font-size: 13px; }
td.num { text-align: right; font-family: var(--f-mono); font-size: 13px; }
tr.flag td { color: var(--bad); }
.meter { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; min-width: 80px; border: 1px solid var(--line); }
.meter span { display: block; height: 100%; background: var(--ok); }
.meter span.warn { background: var(--warn); } .meter span.bad { background: var(--bad); }
.sheets2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 28px; }

/* ---------- overlay ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--panel); border-radius: 10px; border: 1px solid var(--line); width: min(640px, 100%); max-height: 90%; overflow: auto; padding: 18px; display: grid; gap: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 14px; z-index: 30; }

@media (max-width: 1100px) {
  .work { grid-template-columns: 270px minmax(0,1fr); }
  .inspector { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  .work { flex: none; }
  .stagecol { height: 72vh; }
}
@media (max-width: 720px) {
  .work { grid-template-columns: minmax(0,1fr); }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
  .stagecol { height: 70vh; }
  .paper { flex: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><i aria-hidden="true"></i>Stageplot</div>
  <div class="week">
    <label class="label" for="weekSel">Week</label>
    <select id="weekSel" aria-label="Choose week"></select>
    <input id="planDate" type="date" aria-label="Service date">
    <input id="planName" type="text" aria-label="Plan name" placeholder="Service name">
    <button id="nextCopy" title="Copy this week's stage, gear and team to the following Sunday">Next week (copy)</button>
    <button id="nextStage" title="Start the following Sunday with this stage and infrastructure but no team">Next week (stage only)</button>
  </div>
  <div class="seg" role="group" aria-label="View">
    <button id="vPlot" aria-pressed="true">Plot</button>
    <button id="vPaper" aria-pressed="false">Paperwork</button>
  </div>
  <button id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
  <button id="dataBtn">Save / load</button>
</header>

<main class="work" id="plotView">
  <aside class="rail">
    <div class="tabs" role="tablist">
      <button role="tab" id="tTeam" aria-selected="true">Team</button>
      <button role="tab" id="tGear" aria-selected="false">Gear</button>
      <button role="tab" id="tStage" aria-selected="false">Stage</button>
    </div>
    <div id="railPane" class="pane"></div>
  </aside>

  <section class="stagecol">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Tool">
        <button id="mSelect" aria-pressed="true" title="Select and move (Esc)">Move</button>
        <button id="mCable" aria-pressed="false" title="Run a cable (C)">Run cable</button>
      </div>
      <select id="cableType" aria-label="Cable type"></select>
      <span class="hint" id="toolHint"></span>
      <span class="spacer"></span>
      <button id="zOut" aria-label="Zoom out">−</button>
      <button id="zFit">Fit</button>
      <button id="zIn" aria-label="Zoom in">+</button>
    </div>
    <div class="scroller" id="scroller"><svg id="plot" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stage plot"></svg></div>
    <div class="statusline" id="status"></div>
  </section>

  <aside class="inspector" id="inspector"></aside>
</main>

<main class="paper" id="paperView" hidden><div class="paper-inner" id="paperInner"></div></main>

<div class="overlay" id="dataDlg" hidden>
  <div class="modal" role="dialog" aria-labelledby="dataTitle">
    <div class="row" style="justify-content:space-between"><h2 class="h" id="dataTitle">Save / load</h2><button id="dataClose">Close</button></div>
    <p class="hint">Weeks save automatically in this browser. To move them to another computer or keep a backup, copy the JSON below and paste it somewhere safe, or load a saved file.</p>
    <div class="row">
      <button id="copyAll" class="primary">Copy all weeks</button>
      <button id="copyOne">Copy this week</button>
      <button id="dlAll">Download .json</button>
    </div>
    <textarea id="dataText" rows="9" aria-label="Plan JSON" spellcheck="false"></textarea>
    <div class="row">
      <button id="loadPaste">Load pasted JSON</button>
      <label class="row" for="loadFile"><span class="label">or file</span><input type="file" id="loadFile" accept=".json,application/json"></label>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <div class="row" style="justify-content:space-between">
      <span class="hint">Remove this week from the list.</span>
      <button id="delWeek" class="danger">Delete this week</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ===================================================================
   Catalog: every unit is feet. w = width (stage left/right), d = depth.
   =================================================================== */
const CAT = {
  // sizes below are feet (internal unit); the UI converts to metres
  person:      { name: 'Performer', cat: 'person', w: 1.5, d: 1.5, shape: 'person', hidden: true },
  // Audio
  vox_mic:     { name: 'Vocal mic (wired)', cat: 'audio', w: .9, d: .9, shape: 'round', inputs: ['Vox'] },
  vox_wl:      { name: 'Vocal mic (wireless)', cat: 'audio', w: .9, d: .9, shape: 'round', inputs: ['Vox RF'], wireless: true },
  headset:     { name: 'Headset (wireless)', cat: 'audio', w: .9, d: .9, shape: 'round', inputs: ['Headset RF'], wireless: true },
  inst_mic:    { name: 'Instrument mic', cat: 'audio', w: .9, d: .9, shape: 'round', inputs: ['Inst'] },
  di_mono:     { name: 'DI box (mono)', cat: 'audio', w: .8, d: .6, shape: 'rect', inputs: ['DI'] },
  di_stereo:   { name: 'DI box (stereo)', cat: 'audio', w: 1, d: .6, shape: 'rect', inputs: ['DI L', 'DI R'] },
  wedge:       { name: 'Wedge monitor', cat: 'audio', w: 2, d: 1.4, shape: 'wedge', outs: 1, watts: 300 },
  iem:         { name: 'IEM pack', cat: 'audio', w: .6, d: .6, shape: 'rect', wireless: true, iem: true },
  iem_rack:    { name: 'IEM transmitter rack', cat: 'infra', w: 2, d: 2, shape: 'rack', outs: 8, watts: 120 },
  stagebox:    { name: 'Stage box / digital snake', cat: 'infra', w: 2, d: 1.4, shape: 'rack', ins: 32, outsMax: 16, watts: 120, short: 'Stage box' },
  foh:         { name: 'FOH console', cat: 'infra', w: 6, d: 3, shape: 'desk', watts: 250, desk: true },
  mon_desk:    { name: 'Monitor console', cat: 'infra', w: 4, d: 2.5, shape: 'desk', watts: 200, desk: true },
  main_spk:    { name: 'Main speaker (powered)', cat: 'audio', w: 2, d: 2, shape: 'speaker', outs: 1, watts: 600 },
  sub:         { name: 'Subwoofer (powered)', cat: 'audio', w: 3, d: 3, shape: 'speaker', outs: 1, watts: 1000 },
  // Instruments & staging
  drum_kit:    { name: 'Drum kit', cat: 'inst', w: 6.5, d: 5.5, shape: 'kit',
                 inputs: ['Kick In', 'Kick Out', 'Snare Top', 'Snare Btm', 'Hi-hat', 'Rack Tom', 'Floor Tom', 'OH L', 'OH R'] },
  drum_shield: { name: 'Drum shield', cat: 'staging', w: 8, d: .4, shape: 'rect' },
  gtr_amp:     { name: 'Guitar amp (miked)', cat: 'inst', w: 2, d: 1, shape: 'rect', inputs: ['Gtr Amp'], watts: 120 },
  bass_amp:    { name: 'Bass amp', cat: 'inst', w: 2, d: 1.5, shape: 'rect', watts: 400 },
  keys:        { name: 'Keyboard rig', cat: 'inst', w: 5, d: 2, shape: 'keys', inputs: ['Keys L', 'Keys R'], watts: 150 },
  pedalboard:  { name: 'Pedalboard', cat: 'inst', w: 2.5, d: 1.2, shape: 'rect', watts: 30 },
  laptop:      { name: 'Tracks laptop', cat: 'inst', w: 2, d: 1.5, shape: 'rect', inputs: ['Tracks L', 'Tracks R', 'Click'], watts: 90 },
  music_stand: { name: 'Music stand', cat: 'staging', w: 1.5, d: .8, shape: 'rect' },
  pulpit:      { name: 'Pulpit', cat: 'staging', w: 2.5, d: 2, shape: 'rect' },
  riser:       { name: 'Riser 2.4 × 2.4 m', cat: 'staging', w: 8, d: 8, shape: 'platform' },
  drum_riser:  { name: 'Drum riser', cat: 'staging', w: 8, d: 8, shape: 'platform' },
  // Power
  distro:      { name: 'Power distro', cat: 'power', w: 2, d: 1.5, shape: 'rack', circuits: 6, amps: 16, volts: 230 },

const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Positions are stored in feet internally (keeps older saved weeks valid); everything shown or typed is metric. */

/* ===================================================================
   Build stage from team (keeps hand-moved positions via genKey)
   =================================================================== */
function buildFromTeam() {
  const W = plan.stage.w, D = plan.stage.d;
  const old = new Map(plan.items.filter(i => i.gen).map(i => [i.genKey, i]));
  const removed = new Set(plan.items.filter(i => i.gen).map(i => i.id));
  plan.items = plan.items.filter(i => !i.gen);
  const roleCount = {};
  const keepIds = new Set();
  for (const person of plan.team) {
    const role = ROLES[person.role]; if (!role) continue;
    const gear = role.gear.slice();
    if (person.sings && !gear.some(g => g[0] === 'vox_mic' || g[0] === 'vox_wl')) gear.push(['vox_mic', .8, .9]);
    if (!gear.length || !role.anchor) continue;
    const k = roleCount[person.role] = (roleCount[person.role] ?? -1) + 1;
    const spread = role.spread || [0];
    const off = spread[k % spread.length] + Math.floor(k / spread.length) * 2;
    const ax = role.anchor[0] * W + off, ay = role.anchor[1] * D;
    gear.forEach(([type, dx, dy, opts], gi) => {
      const genKey = `${person.role}#${k}:${gi}:${type}`;
      const prev = old.get(genKey);
      const o = opts || {};
      const fn = firstName(person.name);
      const label = type === 'person' ? person.name : `${fn} ${o.label || cat({ type }).short || cat({ type }).name}`;
      const x = prev ? prev.x : clamp(ax + dx, -20, W + 20), y = prev ? prev.y : ay + dy;
      const extra = { gen: true, genKey, personId: person.id, label: prev?.labelEdited && prev.personId === person.id ? prev.label : label, rot: prev ? prev.rot : 0 };
      if (prev?.labelEdited && prev.personId === person.id) extra.labelEdited = true;
      const base = o.inputs || CAT[type].inputs;
      if (base) extra.inputs = base.map(n => `${fn} ${n}`);
      if (prev) { for (const kk of ['w', 'd', 'watts', 'ins', 'outsMax', 'outs']) if (prev[kk] !== undefined) extra[kk] = prev[kk]; if (prev.inputsEdited && prev.personId === person.id) { extra.inputs = prev.inputs; extra.inputsEdited = true; } }
      const it = addItem(type, x, y, extra);
      if (prev) { it.id = prev.id; keepIds.add(prev.id); }
    });
  }
  for (const id of keepIds) removed.delete(id);
  plan.cables = plan.cables.filter(c => !removed.has(c.from) && !removed.has(c.to));
}

/* ===================================================================
   Cable geometry & auto-cabling
   =================================================================== */
function routePts(c) {
  const a = itemById(c.from), b = itemById(c.to);
  if (!a || !b) return null;
  return [[a.x, a.y], ...c.points, [b.x, b.y]];
}
function orth(pts) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i - 1], q = pts[i];
    if (p[0] !== q[0] && p[1] !== q[1]) out.push([q[0], p[1]]);
    out.push(q);
  }
  return out;
}
const runLen = pts => pts.reduce((s, p, i) => i ? s + Math.abs(p[0] - pts[i - 1][0]) + Math.abs(p[1] - pts[i - 1][1]) : 0, 0);
function cableLen(c) {
  const pts = routePts(c); if (!pts) return 0;
  const slack = (c.slack ?? plan.settings.slack) / 100;
  return runLen(pts) * (1 + slack) + 2 * (Number(plan.settings.ends) || 0);   // feet
}
/* Pick stock lengths covering the run: smallest single length that fits, else joined max-lengths. */
function stockFor(type, lenFt) {
  const s = CABLES[type].stock, max = s[s.length - 1], out = [];
  let rest = toM(lenFt);
  while (rest > max) { out.push(max); rest -= max; }
  out.push(s.find(x => x >= rest) || max);
  return out;
}
function cableQty(c) {
  if (c.type !== 'xlr') return 1;
  const a = itemById(c.from), b = itemById(c.to);
  const src = [a, b].find(i => i && i.type !== 'stagebox' && !cat(i).desk);
  if (!src) return 1;
  return Math.max(1, inputsOf(src).length || Number(prop(src, 'outs')) || 1);
}
const touches = (c, id) => c.from === id || c.to === id;
const other = (c, id) => itemById(c.from === id ? c.to : c.from);
const dist = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
function nearest(it, list) { let best = null, bd = Infinity; for (const o of list) { const d = dist(it, o); if (d < bd) { bd = d; best = o; } } return best; }

function circuitLoads(src) {
  const n = Number(prop(src, 'circuits')) || 1, loads = Array(n).fill(0), items = Array.from({ length: n }, () => []);
  for (const c of plan.cables) {
    if (c.type !== 'power' || !touches(c, src.id)) continue;
    const it = other(c, src.id); if (!it || isPowerSource(it)) continue;
    const k = clamp((c.circuit || 1) - 1, 0, n - 1);
    loads[k] += Number(prop(it, 'watts')) || 0; items[k].push(it);
  }
  return { loads, items, cap: (Number(prop(src, 'amps')) || 16) * (Number(prop(src, 'volts')) || 230) };
}

function autoCable() {
  plan.cables = plan.cables.filter(c => !c.auto);
  const boxes = plan.items.filter(i => i.type === 'stagebox');
  const sources = plan.items.filter(isPowerSource);
  const desks = plan.items.filter(i => cat(i).desk);
  const has = (it, type, pred) => plan.cables.some(c => c.type === type && touches(c, it.id) && (!pred || pred(other(c, it.id))));
  const portUse = new Map(boxes.map(b => [b.id, { ins: 0, outs: 0 }]));
  for (const c of plan.cables) { // count manual patches first
    if (c.type !== 'xlr') continue;
    const b = [itemById(c.from), itemById(c.to)].find(i => i && i.type === 'stagebox'); if (!b) continue;
    const o = other(c, b.id); if (!o) continue;
    portUse.get(b.id).ins += inputsOf(o).length; portUse.get(b.id).outs += Number(prop(o, 'outs')) || 0;
  }
  const pickBox = (it, need, key) => {
    const sorted = boxes.slice().sort((a, b) => dist(it, a) - dist(it, b));
    return sorted.find(b => portUse.get(b.id)[key] + need <= (Number(prop(b, key === 'ins' ? 'ins' : 'outsMax')) || 0)) || sorted[0];
  };
  const order = plan.items.slice().sort((a, b) => rankItem(a) - rankItem(b));
  for (const it of order) {
    if (it.type === 'stagebox' || cat(it).desk) continue;
    const ins = inputsOf(it).length, outs = Number(prop(it, 'outs')) || 0;
    if (boxes.length && ins && !cat(it).wireless && !has(it, 'xlr')) {
      const b = pickBox(it, ins, 'ins'); portUse.get(b.id).ins += ins; addCable('xlr', it.id, b.id, { auto: true });
    }
    if (boxes.length && outs && !has(it, 'xlr')) {
      const b = pickBox(it, outs, 'outs'); portUse.get(b.id).outs += outs; addCable('xlr', b.id, it.id, { auto: true });
    }
  }
  for (const it of order) {
    if (!needsPower(it) || has(it, 'power') || !sources.length) continue;
    const src = nearest(it, sources);
    const { loads } = circuitLoads(src);
    const w = Number(prop(it, 'watts')) || 0;
    let k = loads.indexOf(Math.min(...loads));
    addCable('power', it.id, src.id, { auto: true, circuit: k + 1 });
    loads[k] += w;
  }
  for (const b of boxes) for (const d of desks) if (!plan.cables.some(c => c.type === 'cat6' && touches(c, b.id) && touches(c, d.id))) addCable('cat6', b.id, d.id, { auto: true });
}

/* ===================================================================
   Paperwork calculations
   =================================================================== */
function rankItem(it) {
  const p = it.personId ? personById(it.personId) : null;
  const r = p ? ROLE_ORDER.indexOf(p.role) : -1;
  const roleRank = r < 0 ? 50 : r;
  const voc = ['vox_mic', 'vox_wl', 'headset'].includes(it.type) ? .5 : 0;
  return roleRank + voc + it.x / 1000;
}
function patchOf(it) {
  if (cat(it).wireless) return { kind: 'rf' };
  const c = plan.cables.find(c => c.type === 'xlr' && touches(c, it.id) && (() => { const o = other(c, it.id); return o && (o.type === 'stagebox' || cat(o).desk); })());
  if (!c) return null;
  return { kind: 'box', box: other(c, it.id) };
}
function inputList() {
  const srcs = plan.items.filter(i => inputsOf(i).length).sort((a, b) => rankItem(a) - rankItem(b));
  const counters = new Map(), rows = [];
  let ch = 0;
  for (const it of srcs) {
    const patch = patchOf(it);
    for (const name of inputsOf(it)) {
      ch++;
      let port = '—', flag = false;
      if (patch?.kind === 'rf') port = 'RF receiver';
      else if (patch?.box) {
        const b = patch.box;
        if (cat(b).desk) port = `${itemName(b)} local`;
        else {
          const n = (counters.get(b.id) || 0) + 1; counters.set(b.id, n);
          port = `${itemName(b)} · in ${n}`;
          if (n > (Number(prop(b, 'ins')) || 0)) flag = true;
        }
      } else flag = true;
      const person = it.personId ? personById(it.personId) : null;
      rows.push({ ch, name, source: cat(it).name, person: person?.name || '', port, flag, unpatched: !patch });
    }
  }
  return rows;
}
function outputList() {
  const rows = [], counters = new Map();
  const outs = plan.items.filter(i => Number(prop(i, 'outs')) > 0).sort((a, b) => a.x - b.x);
  for (const it of outs) {
    const patch = patchOf(it);
    const n = Number(prop(it, 'outs'));
    for (let k = 1; k <= n; k++) {
      let port = '—', flag = !patch;
      if (patch?.box && !cat(patch.box).desk) {
        const m = (counters.get(patch.box.id) || 0) + 1; counters.set(patch.box.id, m);
        port = `${itemName(patch.box)} · out ${m}`;
        if (m > (Number(prop(patch.box, 'outsMax')) || 0)) flag = true;
      } else if (patch?.box) port = `${itemName(patch.box)} local`;
      rows.push({ dest: itemName(it) + (n > 1 ? ` · ${k}` : ''), type: cat(it).name, port, flag });
    }
  }
  return rows;
}
function monitorMixes() {
  const rows = []; let mix = 0;
  for (const p of plan.team.slice().sort((a, b) => ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role))) {
    const mons = plan.items.filter(i => i.personId === p.id && (cat(i).iem || i.type === 'wedge'));
    for (const m of mons) rows.push({ mix: ++mix, person: p.name, role: p.role, kind: cat(m).iem ? 'IEM' : 'Wedge' });
  }
  return rows;
}
function pullList() {
  const map = new Map();
  for (const c of plan.cables) {
    const len = cableLen(c); if (!len) continue;
    const q = cableQty(c);
    for (const s of stockFor(c.type, len)) {
      const k = `${c.type}|${s}`; map.set(k, (map.get(k) || 0) + q);
    }
  }
  return [...map.entries()].map(([k, n]) => { const [type, len] = k.split('|'); return { type, len: Number(len), n }; })
    .sort((a, b) => Object.keys(CABLES).indexOf(a.type) - Object.keys(CABLES).indexOf(b.type) || a.len - b.len);
}
function warnings() {
  const out = [];
  const W = plan.stage.w, D = plan.stage.d, hw = Math.max(W, plan.stage.houseW);
  for (const b of plan.items.filter(i => i.type === 'stagebox')) {
    const used = inputList().filter(r => r.port.startsWith(itemName(b) + ' · in')).length;
    if (used > Number(prop(b, 'ins'))) out.push({ lvl: 'bad', msg: `${itemName(b)}: ${used} inputs patched, only ${prop(b, 'ins')} available.` });
    const uo = outputList().filter(r => r.port.startsWith(itemName(b) + ' · out')).length;
    if (uo > Number(prop(b, 'outsMax'))) out.push({ lvl: 'bad', msg: `${itemName(b)}: ${uo} outputs used, only ${prop(b, 'outsMax')} available.` });
  }
  for (const src of plan.items.filter(isPowerSource)) {
    const { loads, cap } = circuitLoads(src);
    loads.forEach((w, k) => {
      if (w > cap) out.push({ lvl: 'bad', msg: `${itemName(src)} circuit ${k + 1}: ${Math.round(w)} W is over the ${cap} W breaker.` });
      else if (w > cap * .8) out.push({ lvl: 'warn', msg: `${itemName(src)} circuit ${k + 1}: ${Math.round(w)} W is above 80% of ${cap} W.` });
    });
  }
  const unp = plan.items.filter(i => inputsOf(i).length && !patchOf(i));
  for (const i of unp) out.push({ lvl: 'warn', msg: `${itemName(i)} isn't patched to a stage box or desk.` });
  for (const i of plan.items.filter(i => needsPower(i) && !plan.cables.some(c => c.type === 'power' && touches(c, i.id))))
    out.push({ lvl: 'warn', msg: `${itemName(i)} needs power (${prop(i, 'watts')} W) and has no power run.` });
  for (const i of plan.items) {
    const hx0 = Math.min(0, (W - hw) / 2) - 10, hx1 = Math.max(W, (W + hw) / 2) + 10;
    if (i.x < hx0 || i.x > hx1 || i.y < -6 || i.y > D + plan.stage.house + 4) out.push({ lvl: 'warn', msg: `${itemName(i)} is outside the drawing.` });
  }
  for (const p of plan.team) if (!ROLES[p.role]) out.push({ lvl: 'warn', msg: `${p.name || 'A team member'} has no position.` });
  return out;
}

function sizePlot() {

    case 'wedge': body = `<polygon class="${cls}" points="${-hw},${hd} ${hw},${hd} ${hw * .65},${-hd} ${-hw * .65},${-hd}"/>`; break;
    case 'platform': body = `<rect class="${cls}" x="${-hw}" y="${-hd}" width="${w}" height="${d}"/>`; break;
    case 'speaker':
      body = `<rect class="${cls}" x="${-hw}" y="${-hd}" width="${w}" height="${d}" rx=".1"/>`;

      for (let x = -hw + .5; x < hw - .3; x += .45) detail += `<line class="detail" x1="${x}" x2="${x}" y1="${hd * .1}" y2="${hd - .3}"/>`;
      detail += `<rect class="detail" x="${-hw * .5}" y="${-hd + .3}" width="${hw}" height="${hd * .7}"/>`; break;

      const drums = [[0, -1.4, 1.1], [-1.2, .3, .75], [1.5, -.4, .7], [2.2, 1, .95], [-2.3, -.6, .6], [-2.4, 1.6, .9], [2.6, -1.7, .9]];

    }
    case 'keys':

      detail = `<rect class="detail" x="${-hw + .2}" y="${hd - .7}" width="${w - .4}" height=".5"/>`; break;
    case 'rack':

      detail = `<line class="detail" x1="${-hw + .2}" x2="${hw - .2}" y1="${-hd + .35}" y2="${-hd + .35}"/><line class="detail" x1="${-hw + .2}" x2="${hw - .2}" y1="${-hd + .7}" y2="${-hd + .7}"/>`; break;

  // label: big items get it inside, small items below
  const big = Math.min(w, d) >= 1.6 && c.shape !== 'person';
  const text = c.shape === 'person' ? firstName(personById(it.personId)?.name || it.label) : (it.label || c.short || c.name);

    ? `<rect class="selbox" x="${it.x - Math.max(w, d) / 2 - .3}" y="${it.y - Math.max(w, d) / 2 - .3}" width="${Math.max(w, d) + .6}" height="${Math.max(w, d) + .6}" rx=".2"/>` : '';

function renderPlot() {

  }

  s += `<text class="zone on-deck" x="${w / 2}" y="${d - .5}" text-anchor="middle">DOWNSTAGE</text>`;
  s += `<text class="zone on-deck" x=".5" y="${d / 2}" transform="rotate(-90 .5 ${d / 2})" text-anchor="middle" dy=".5">STAGE RIGHT</text>`;
  s += `<text class="zone on-deck" x="${w - .5}" y="${d / 2}" transform="rotate(90 ${w - .5} ${d / 2})" text-anchor="middle" dy=".5">STAGE LEFT</text>`;
  s += `<text class="zone" x="${w / 2}" y="${d + house - .6}" text-anchor="middle">HOUSE · ${fmtLen(w, 2)} × ${fmtLen(d, 2)} STAGE</text>`;

/* ===================================================================

const PCO = 'Planning Center';
const pco = { mcp: undefined, busy: '', err: '', types: [], typeId: '', plans: [], planId: '', roster: null, picked: new Set(), replace: true };

function pcoErrText(e) {
  switch (e?.code) {
    case 'needs_reauth': return 'Planning Center needs signing in again. Reconnect it in claude.ai Settings → Connectors, then try again.';
    case 'server_not_connected': case 'server_not_found': return 'Planning Center isn’t connected for you. Add it in claude.ai Settings → Connectors.';
    case 'selection_required': return 'You have more than one Planning Center connection. Choose one when Claude asks, then try again.';
    case 'not_in_manifest': case 'consent_required': return 'Planning Center is switched off for this page. Allow it from the page’s Permissions menu.';
    case 'blocked_by_policy': return 'Your organisation blocks Planning Center here.';
    case 'approval_required': return 'Planning Center needs your approval. Try again and choose Allow.';
    case 'tool_error': return `Planning Center said: ${e.message || 'the request failed'}.`;
    case 'server_unavailable': case 'rate_limited': return 'Planning Center isn’t answering right now. Wait a moment and try again.';
    case 'not_granted': case 'capability_disabled': case 'capability_removed': return 'Connectors aren’t available in this view.';
    default: return `Couldn’t reach Planning Center (${e?.message || 'unknown error'}).`;
  }
}
async function pcoCall(tool, input) {
  try { return (await pco.mcp.callTool(PCO, tool, input)).payload; }
  catch (e) {
    if (e?.retryable) { await new Promise(r => setTimeout(r, Math.min(e.retryAfterMs || 1500 + Math.random() * 1000, 10000))); return (await pco.mcp.callTool(PCO, tool, input)).payload; }
    throw e;
  }
}
async function pcoRun(label, fn) {
  pco.busy = label; pco.err = ''; renderRail();
  try { await fn(); } catch (e) { pco.err = pcoErrText(e); }
  pco.busy = ''; renderRail();
}
const pcoLoadTypes = () => pcoRun('Loading services…', async () => {
  const r = await pcoCall('services_service_types', { per_page: 100, order_by: 'sequence', output_fields: ['id', 'name'] });
  pco.types = (r?.data || []).map(t => ({ id: t.id, name: t.attributes?.name || `Service ${t.id}` }));
  if (!pco.types.length) { pco.err = 'No service types found in Planning Center.'; return; }
  pco.typeId = (pco.types.find(t => /weekend|sunday|service/i.test(t.name)) || pco.types[0]).id;
  await pcoLoadPlansInner();
});
async function pcoLoadPlansInner() {
  pco.plans = []; pco.planId = ''; pco.roster = null;
  const r = await pcoCall('services_plans', { service_type_id: pco.typeId, filter: 'future', order_by: 'sort_date', per_page: 15, output_fields: ['id', 'title', 'dates', 'sort_date', 'series_title'] });
  pco.plans = (r?.data || []).map(p => ({ id: p.id, title: p.attributes?.title || p.attributes?.series_title || '', dates: p.attributes?.dates || '', date: String(p.attributes?.sort_date || '').slice(0, 10) }));
  pco.planId = (pco.plans.find(p => p.date === plan.date) || pco.plans[0])?.id || '';
  if (!pco.plans.length) pco.err = 'No upcoming plans in this service type.';
}
const pcoLoadPlans = () => pcoRun('Loading plans…', pcoLoadPlansInner);
const pcoLoadRoster = () => pcoRun('Loading roster…', async () => {
  const rows = [], teams = new Map();
  let after = null;
  for (let page = 0; page < 6; page++) {
    const input = { service_type_id: pco.typeId, plan_id: pco.planId, per_page: 100, filter: ['not_declined'], include: ['team'], output_fields: ['id', 'name', 'status', 'team_position_name'] };
    if (after) input.page_after = after;
    const r = await pcoCall('services_plan_people', input);
    for (const t of r?.included || []) if (t.type === 'Team') teams.set(t.id, t.attributes?.name || '');
    rows.push(...(r?.data || []));
    if (!r?.has_more || !r?.next_page_token) break;
    after = r.next_page_token;
  }
  // one entry per person; someone on two positions (e.g. Acoustic + Vocals) keeps the instrument and "also sings"
  const people = new Map();
  for (const row of rows) {
    const a = row.attributes || {}, key = row.relationships?.person?.data?.id || a.name;
    const team = teams.get(row.relationships?.team?.data?.id) || '';
    const pos = a.team_position_name || '';
    const role = matchRole(pos) || (ROLES[matchRole(team)]?.gear?.length === 0 ? matchRole(team) : '');
    const e = people.get(key) || { key, name: a.name || 'Unnamed', positions: [], roles: [], unconfirmed: false };
    e.positions.push([pos, team].filter(Boolean).join(' · '));
    if (role) e.roles.push(role);
    if (a.status && a.status !== 'confirmed') e.unconfirmed = true;
    people.set(key, e);
  }
  const rank = r => { const i = ROLE_ORDER.indexOf(r); return i < 0 ? 99 : (r === 'Vocalist' || r === 'Worship Leader' ? 50 + i : i); };
  pco.roster = [...people.values()].map(e => {
    const roles = [...new Set(e.roles)].sort((a, b) => rank(a) - rank(b));
    const role = roles.includes('Worship Leader') ? 'Worship Leader' : roles[0] || '';

    return { ...e, role, sings };
  }).sort((a, b) => (a.role ? 0 : 1) - (b.role ? 0 : 1) || rank(a.role) - rank(b.role) || a.name.localeCompare(b.name));

function pcoApply() {
  const chosen = pco.roster.filter(e => pco.picked.has(e.key));
  if (!chosen.length) { toast('Tick at least one person'); return; }
  const pl = pco.plans.find(p => p.id === pco.planId);
  mutate(() => {
    if (pco.replace) plan.team = [];
    for (const e of chosen) {
      if (plan.team.some(p => p.pcoId === e.key)) continue;
      plan.team.push({ id: uid(), name: e.name, role: e.role, sings: e.sings, pcoId: e.key });
    }
    if (pl?.date) plan.date = pl.date;
    if (pl) plan.name = pl.title || pl.dates || plan.name;

}

/* ===================================================================
   Events
   =================================================================== */
function toFt(e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const m = svg.getScreenCTM(); if (!m) return { x: 0, y: 0 };
  const p = pt.matrixTransform(m.inverse()); return { x: p.x, y: p.y };
}
svg.addEventListener('pointerdown', e => {
  const p = toFt(e);
  const g = e.target.closest('[data-id]'), ch = e.target.closest('[data-cid]'), wp = e.target.closest('[data-wp]');
  if (mode === 'cable') {
    if (g) {
      const id = g.dataset.id;
      if (!pending) pending = { from: id, points: [] };
      else if (id !== pending.from) {
        const pts = pending.points, from = pending.from; pending = null;
        mutate(() => {
          const c = addCable(cableType, from, id, { points: pts });
          if (cableType === 'power') {
            const src = [itemById(from), itemById(id)].find(isPowerSource);
            if (src) { const { loads } = circuitLoads(src); c.circuit = loads.indexOf(Math.min(...loads)) + 1; }
          }
          sel = { kind: 'cable', id: c.id };
        });
        return;
      }
    } else if (pending) pending.points.push([snapTo(p.x, .25), snapTo(p.y, .25)]);
    renderToolbar(); renderPlot(); return;
  }
  if (wp) {
    const [cid, k] = wp.dataset.wp.split(':');
    drag = { kind: 'wp', cid, k: Number(k), snap: JSON.stringify(plan), moved: false };
  } else if (g) {
    const it = itemById(g.dataset.id);
    sel = { kind: 'item', id: it.id };
    drag = { kind: 'item', id: it.id, ox: p.x - it.x, oy: p.y - it.y, snap: JSON.stringify(plan), moved: false };
  } else if (ch) {
    sel = { kind: 'cable', id: ch.dataset.cid };
  } else { sel = null; renderPlot(); renderInspector(); return; }
  try { svg.setPointerCapture(e.pointerId); } catch { /* ok */ }
  e.preventDefault();
  renderPlot(); renderInspector();
});
svg.addEventListener('pointermove', e => {
  if (pending) { const p = toFt(e); cursorPt = [snapTo(p.x, .25), snapTo(p.y, .25)]; renderPlot(); return; }
  if (!drag) return;
  const p = toFt(e);
  if (drag.kind === 'item') {
    const it = itemById(drag.id); if (!it) return;
    const nx = snapTo(p.x - drag.ox), ny = snapTo(p.y - drag.oy);
    if (nx !== it.x || ny !== it.y) { it.x = nx; it.y = ny; drag.moved = true; renderPlot(); }
  } else {
    const c = plan.cables.find(x => x.id === drag.cid); if (!c) return;
    c.points[drag.k] = [snapTo(p.x, .25), snapTo(p.y, .25)]; c.auto = false; drag.moved = true; renderPlot();
  }
});
function endDrag() {
  if (drag?.moved) { history.push(drag.snap); save(); drag = null; renderAll(); }
  drag = null;
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

function deleteSelected() {
  if (!sel) return;
  mutate(() => {
    if (sel.kind === 'item') { plan.items = plan.items.filter(i => i.id !== sel.id); plan.cables = plan.cables.filter(c => !touches(c, sel.id)); }
    else plan.cables = plan.cables.filter(c => c.id !== sel.id);
    sel = null;
  });
}
function rotateSelected(by) { const it = sel?.kind === 'item' && itemById(sel.id); if (it) mutate(() => { it.rot = ((it.rot || 0) + by + 360) % 360; }); }
function setMode(m) { mode = m; pending = null; cursorPt = null; renderToolbar(); renderPlot(); }

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !['input', 'textarea'].includes(tag)) { e.preventDefault(); undo(); return; }
  if (['input', 'textarea', 'select'].includes(tag)) return;
  if (!$('dataDlg').hidden) { if (e.key === 'Escape') $('dataDlg').hidden = true; return; }
  if (view !== 'plot') return;
  if (e.key === 'Escape') { if (pending) { pending = null; renderToolbar(); renderPlot(); } else if (mode === 'cable') setMode('select'); else { sel = null; renderPlot(); renderInspector(); } }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
  else if (e.key.toLowerCase() === 'r') rotateSelected(e.shiftKey ? 45 : 90);
  else if (e.key.toLowerCase() === 'c' && !e.ctrlKey && !e.metaKey) setMode(mode === 'cable' ? 'select' : 'cable');
  else if (e.key.startsWith('Arrow') && sel?.kind === 'item') {
    e.preventDefault(); const it = itemById(sel.id), s = fromM(e.shiftKey ? .5 : .05);
    mutate(() => { if (e.key === 'ArrowLeft') it.x -= s; if (e.key === 'ArrowRight') it.x += s; if (e.key === 'ArrowUp') it.y -= s; if (e.key === 'ArrowDown') it.y += s; });
  }
});

$('zIn').onclick = () => { zoom = (zoom || sizePlot()) * 1.25; renderPlot(); };
$('zOut').onclick = () => { zoom = Math.max(3, (zoom || sizePlot()) / 1.25); renderPlot(); };
$('zFit').onclick = () => { zoom = null; renderPlot(); };
window.addEventListener('resize', () => { if (!zoom) renderPlot(); });

$('vPlot').onclick = () => { view = 'plot'; renderAll(); };
$('vPaper').onclick = () => { view = 'paper'; pending = null; renderAll(); };
$('undoBtn').onclick = undo;
$('weekSel').onchange = e => { plan = db.plans[e.target.value]; history = []; sel = null; pending = null; save(); renderAll(); };
$('planName').oninput = e => { plan.name = e.target.value; save(); renderStatus(); };
$('planName').onchange = () => renderHeader();
$('planDate').onchange = e => { if (e.target.value) { plan.date = e.target.value; save(); renderAll(); } };
function nextWeek(stageOnly) {
  const np = JSON.parse(JSON.stringify(plan));
  np.id = uid(); np.date = addDays(plan.date, 7);
  if (stageOnly) {
    np.team = [];
    const gone = new Set(np.items.filter(i => i.gen).map(i => i.id));
    np.items = np.items.filter(i => !i.gen);
    np.cables = np.cables.filter(c => !gone.has(c.from) && !gone.has(c.to));
  }
  db.plans[np.id] = np; plan = np; history = []; sel = null; railTab = 'team'; save(); renderAll();
  toast(`Started ${np.date}`);
}
$('nextCopy').onclick = () => nextWeek(false);
$('nextStage').onclick = () => nextWeek(true);

for (const [id, t] of [['tTeam', 'team'], ['tGear', 'gear'], ['tStage', 'stage']]) $(id).onclick = () => { railTab = t; renderRail(); };

function matchRole(s) { for (const [re, r] of ROLE_MATCH) if (re.test(s)) return r; return ''; }
$('railPane').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'pcoStart') { pcoLoadTypes(); return; }
  if (t.id === 'pcoRoster') { pcoLoadRoster(); return; }
  if (t.id === 'pcoApply') { pcoApply(); return; }
  if (t.id === 'addPerson') mutate(() => { plan.team.push({ id: uid(), name: '', role: '', sings: false }); });
  else if (t.dataset.del) mutate(() => { plan.team = plan.team.filter(p => p.id !== t.dataset.del); buildFromTeam(); });
  else if (t.id === 'buildBtn') { mutate(() => { buildFromTeam(); autoCable(); }); toast('Stage built from team'); }
  else if (t.id === 'bulkAdd') {
    const lines = $('bulk').value.split(/\n/).map(l => l.trim()).filter(Boolean);
    if (!lines.length) { toast('Paste at least one line'); return; }
    mutate(() => {
      for (const l of lines) {
        const parts = l.split(/\t|\s[-–—]\s|,|:/).map(s => s.trim()).filter(Boolean);
        const name = parts[0] || l, rest = parts.slice(1).join(' ');
        const role = matchRole(rest) || matchRole(l);
        plan.team.push({ id: uid(), name, role, sings: !!rest && /vox|vocal|bgv|sing/i.test(rest) && role !== 'Vocalist' && role !== 'Worship Leader' });
      }
    });
    toast(`Added ${lines.length} ${lines.length === 1 ? 'person' : 'people'}`);
  }
  else if (t.dataset.add) {
    mutate(() => {
      const ty = t.dataset.add, n = plan.items.filter(i => i.type === ty).length;
      const it = addItem(ty, snapTo(plan.stage.w / 2 + fromM(.3 * (n % 5))), snapTo(plan.stage.d / 2 + fromM(.3 * (n % 5))));
      if (ty === 'stagebox') it.label = `Stage box ${String.fromCharCode(65 + n)}`;
      if (ty === 'distro') it.label = `Distro ${n + 1}`;
      sel = { kind: 'item', id: it.id };
    });
  }
  else if (t.id === 'autoBtn') { mutate(autoCable); toast('Cables re-run'); }
  else if (t.id === 'clearAuto') mutate(() => { plan.cables = plan.cables.filter(c => !c.auto); });
  else if (t.id === 'clearGen') mutate(() => { const g = new Set(plan.items.filter(i => i.gen).map(i => i.id)); plan.items = plan.items.filter(i => !i.gen); plan.cables = plan.cables.filter(c => !g.has(c.from) && !g.has(c.to)); sel = null; });
});
$('railPane').addEventListener('change', e => {
  const t = e.target, card = t.closest('[data-pid]');
  if (t.id === 'pcoType') { pco.typeId = t.value; pcoLoadPlans(); return; }
  if (t.id === 'pcoPlan') { pco.planId = t.value; pco.roster = null; renderRail(); return; }
  if (t.id === 'pcoReplace') { pco.replace = t.checked; return; }
  if (t.dataset.pick) { t.checked ? pco.picked.add(t.dataset.pick) : pco.picked.delete(t.dataset.pick); renderRail(); return; }
  if (card) {
    const p = personById(card.dataset.pid), f = t.dataset.f;
    mutate(() => {
      p[f] = f === 'sings' ? t.checked : t.value;
      if (plan.items.some(i => i.personId === p.id) || f === 'role') { buildFromTeam(); autoCable(); }
    });
    return;
  }
  const num = v => Number(v);
  const map = {
    sw: () => { plan.stage.w = fromM(clamp(num(t.value) || 10, 3, 60)); },
    sd: () => { plan.stage.d = fromM(clamp(num(t.value) || 6, 2, 40)); },
    shd: () => { plan.stage.house = fromM(clamp(num(t.value) || 12, 2, 100)); },
    shw: () => { plan.stage.houseW = fromM(clamp(num(t.value) || 16, 3, 100)); },
    slack: () => { plan.settings.slack = clamp(num(t.value) || 0, 0, 100); },
    ends: () => { plan.settings.ends = fromM(clamp(num(t.value) || 0, 0, 6)); },
    notes: () => { plan.notes = t.value; },
  };
  if (map[t.id]) mutate(map[t.id]);
});

$('inspector').addEventListener('change', e => {
  const t = e.target;
  const it = sel?.kind === 'item' ? itemById(sel.id) : null;
  const c = sel?.kind === 'cable' ? plan.cables.find(x => x.id === sel.id) : null;
  if (it) mutate(() => {
    const n = Number(t.value);
    switch (t.id) {
      case 'iLabel': it.label = t.value; it.labelEdited = true; break;
      case 'iPerson': it.personId = t.value || undefined; break;
      case 'iX': it.x = fromM(n); break; case 'iY': it.y = fromM(n); break;
      case 'iW': if (n > 0) it.w = fromM(n); break; case 'iD': if (n > 0) it.d = fromM(n); break;
      case 'iRot': it.rot = ((n % 360) + 360) % 360; break;
      case 'iWatts': it.watts = Math.max(0, n); break;
      case 'iInputs': it.inputs = t.value.split(',').map(s => s.trim()).filter(Boolean); it.inputsEdited = true; break;
      case 'iIns': it.ins = Math.max(1, n); break; case 'iOuts': it.outsMax = Math.max(0, n); break;
      case 'iOutsUse': it.outs = Math.max(0, n); break;
      case 'iCirc': it.circuits = Math.max(1, n); break; case 'iAmps': it.amps = Math.max(1, n); break; case 'iVolts': it.volts = Math.max(1, n); break;
    }
  });
  if (c) mutate(() => {
    if (t.id === 'cType') { c.type = t.value; c.auto = false; }
    if (t.id === 'cCirc') { c.circuit = Number(t.value); c.auto = false; }
    if (t.id === 'cSlack') c.slack = t.value === '' ? undefined : Math.max(0, Number(t.value));
  });
});
$('inspector').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.selc) { sel = { kind: 'cable', id: t.dataset.selc }; renderPlot(); renderInspector(); return; }
  if (t.id === 'iRotate') rotateSelected(90);
  if (t.id === 'iDel' || t.id === 'cDel') deleteSelected();
  if (t.id === 'iDup') {
    const it = itemById(sel.id);
    mutate(() => { const copy = { ...JSON.parse(JSON.stringify(it)), id: uid(), x: it.x + fromM(.3), y: it.y + fromM(.3) }; delete copy.gen; delete copy.genKey; plan.items.push(copy); sel = { kind: 'item', id: copy.id }; });
  }
  if (t.id === 'cClear') { const c = plan.cables.find(x => x.id === sel.id); mutate(() => { c.points = []; }); }
});
$('paperInner').addEventListener('click', e => {
  const t = e.target.closest('[data-copy]'); if (t) copyText(paperData[t.dataset.copy], $('copyFallback'));
});

/* ----- save / load ----- */
$('dataBtn').onclick = () => { delArmed = false; $('delWeek').textContent = 'Delete this week'; $('dataText').value = ''; $('dataDlg').hidden = false; };
$('dataClose').onclick = () => { $('dataDlg').hidden = true; };
$('dataDlg').addEventListener('click', e => { if (e.target.id === 'dataDlg') $('dataDlg').hidden = true; });
$('copyAll').onclick = () => { const s = JSON.stringify({ app: 'stageplot', version: 1, plans: db.plans }, null, 1); $('dataText').value = s; copyText(s, $('dataText')); };
$('copyOne').onclick = () => { const s = JSON.stringify({ app: 'stageplot', version: 1, plans: { [plan.id]: plan } }, null, 1); $('dataText').value = s; copyText(s, $('dataText')); };
$('dlAll').onclick = () => {
  const s = JSON.stringify({ app: 'stageplot', version: 1, plans: db.plans }, null, 1);
  $('dataText').value = s;
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([s], { type: 'application/json' }));
    a.download = `stageplot-${plan.date}.json`; document.body.appendChild(a); a.click(); a.remove();
    toast('If no file appeared, copy the text above instead');
  } catch { toast('Download blocked here. Copy the text above instead'); }
};
function importJson(text) {
  let d; try { d = JSON.parse(text); } catch { toast('That isn’t valid JSON. Check you copied all of it.'); return; }
  const plans = d?.plans || (d?.stage && d?.items ? { [d.id || uid()]: d } : null);
  if (!plans) { toast('No weeks found in that JSON'); return; }
  let n = 0, last = null;
  for (const [id, p] of Object.entries(plans)) {
    if (!p?.stage || !Array.isArray(p.items)) continue;
    p.id = id; p.team ||= []; p.cables ||= []; p.settings ||= { slack: 10, ends: fromM(1) };
    db.plans[id] = p; n++; last = p;
  }
  if (!n) { toast('No weeks found in that JSON'); return; }
  plan = last; history = []; sel = null; save(); renderAll(); $('dataDlg').hidden = true; toast(`Loaded ${n} week${n === 1 ? '' : 's'}`);
}
$('loadPaste').onclick = () => importJson($('dataText').value);
$('loadFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importJson(r.result); r.readAsText(f); e.target.value = ''; };
$('delWeek').onclick = () => {
  if (!delArmed) { delArmed = true; $('delWeek').textContent = 'Tap again to delete'; return; }
  delete db.plans[plan.id];
  const ids = Object.keys(db.plans);
  if (!ids.length) { const p = blankPlan(); db.plans[p.id] = p; ids.push(p.id); }
  plan = db.plans[ids.sort().pop()]; history = []; sel = null; save(); renderAll(); $('dataDlg').hidden = true; toast('Week deleted');
};

/* ----- boot ----- */
db = load();
if (db) plan = db.plans[db.currentId] || db.plans[Object.keys(db.plans)[0]];
else { db = seed(); plan = db.plans[db.currentId]; save(); }
renderAll();
requestAnimationFrame(() => renderPlot());
if (window.claude?.use) window.claude.use('mcp').then(m => { pco.mcp = m; renderRail(); }, () => { pco.mcp = null; renderRail(); });
</script>
</body>
</html>
